openapi: 3.1.0
info:
  title: VaultShare API
  version: 1.0.0
  description: >
    Versioned REST API for encrypted temporary vault sharing. Authentication
    uses Cognito access tokens. Per-vault authorization is enforced by the API.
    This contract describes the registered backend routes; see docs/API.md for
    lifecycle semantics and operational limitations.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://localhost:3000/api/v1
    description: Local API base (use path prefix only once)
tags:
  - name: Health
  - name: Identity
  - name: Audit
  - name: Folders
  - name: Vaults
  - name: Shares
  - name: Access requests
  - name: WRITE requests
  - name: Files
security:
  - cognitoAccessToken: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: API process is responding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/v1/auth/me:
    get:
      tags: [Identity]
      summary: Get the authenticated application user
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the presented access token for VaultShare API use
      description: Stores the token JTI until token expiry. This is not a Cognito-wide sign-out on every device.
      responses:
        '204': { description: Token JTI revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/me:
    delete:
      tags: [Identity]
      summary: Delete the authenticated user's account
      description: Starts the retryable account-deletion workflow, including application data destruction, Cognito identity deletion, and tombstone finalization.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { description: Deletion accepted or pending, depending on workflow state. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/audit-events:
    get:
      tags: [Audit]
      summary: List the caller's own audit history
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/folders:
    post:
      tags: [Folders]
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Folders]
      summary: List the authenticated user's folders
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/folders/{id}:
    patch:
      tags: [Folders]
      summary: Rename an owned folder
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Folders]
      summary: Delete an owned folder and detach its vaults
      description: Does not delete vault content, files, shares, or lifecycle state.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults:
    post:
      tags: [Vaults]
      summary: Create an encrypted vault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Vaults]
      summary: List the authenticated user's vaults
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/v1/vaults/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    get:
      tags: [Vaults]
      summary: Get an owned vault
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vaults]
      summary: Update vault metadata before first successful open
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 500 }
                folderId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Vault is no longer editable. }
    delete:
      tags: [Vaults]
      summary: Permanently destroy an owned vault and descendants
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{id}/revoke:
    post:
      tags: [Vaults]
      summary: Revoke source vault access and destroy derived descendants
      description: Retains the source payload under the REVOKE_ACCESS behavior; descendant payloads are destroyed.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{id}/shares/passphrase:
    post:
      tags: [Shares]
      summary: Generate a one-time share passphrase
      description: Returns 24 cryptographically random bytes encoded as a 32-character Base64URL string (192 bits). It is not persisted or retrievable later.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Vault is not active or has expired. }

  /api/v1/vaults/{id}/shares:
    post:
      tags: [Shares]
      summary: Create a per-vault share
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreate' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: An active share exists or access was exhausted. }

  /api/v1/vaults/{id}/shares/revoke-all:
    patch:
      tags: [Shares]
      summary: Revoke all shares for an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/v1/vaults/{id}/shares/{shareId}/revoke:
    patch:
      tags: [Shares]
      summary: Revoke one reader's share without affecting other readers
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/v1/vaults/{id}/shares/{shareId}/extend:
    patch:
      tags: [Shares]
      summary: Extend a share's remaining access count and/or post-open TTL
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                additionalAccesses: { type: integer, minimum: 1, maximum: 1000, default: 1 }
                extendPostOpenBySeconds: { type: integer, minimum: 1, maximum: 31536000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Share is revoked or its post-open window has expired. }

  /api/v1/shares/{shareCode}/open:
    post:
      tags: [Shares]
      summary: Open a shared vault
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { description: Invalid passphrase or authentication. }
        '410': { description: Share or vault access has expired. }
        '429': { description: Passphrase attempt rate limit exceeded. }

  /api/v1/shares/{shareCode}/write-requests:
    post:
      tags: [WRITE requests]
      summary: Submit a proposed content change using a WRITE share
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposedContent, passphrase]
              properties:
                proposedContent: { type: string, minLength: 1, maxLength: 900000 }
                passphrase: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Share does not grant WRITE permission. }

  /api/v1/access-requests/vaults/{vaultId}:
    post:
      tags: [Access requests]
      summary: Request access to a vault
      parameters:
        - name: vaultId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/access-requests/{requestId}/cancel:
    patch:
      tags: [Access requests]
      summary: Cancel the caller's pending access request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{id}/access-requests:
    get:
      tags: [Access requests]
      summary: List access requests for an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{id}/access-requests/{requestId}/review:
    patch:
      tags: [Access requests]
      summary: Approve or reject an access request
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                responseMessage: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/vaults/{id}/write-requests:
    get:
      tags: [WRITE requests]
      summary: List WRITE requests for an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/v1/vaults/{id}/write-requests/{requestId}:
    get:
      tags: [WRITE requests]
      summary: Get a WRITE request for an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{id}/write-requests/{requestId}/review:
    post:
      tags: [WRITE requests]
      summary: Approve or reject a WRITE request
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/vaults/{id}/files:
    post:
      tags: [Files]
      summary: Upload one encrypted file to an owned vault
      description: multipart/form-data with one file field. Maximum size is MAX_FILE_SIZE_BYTES (default 10 MiB; maximum 100 MiB).
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: Uploaded file exceeds configured limit. }
    get:
      tags: [Files]
      summary: List files in an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /api/v1/vaults/{id}/files/{fileId}:
    delete:
      tags: [Files]
      summary: Delete a file from an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: File deleted; physical blob cleanup is asynchronous. }

  /api/v1/vaults/{id}/files/{fileId}/download:
    get:
      tags: [Files]
      summary: Download a file from an owned vault
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decrypted file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/shares/{shareCode}/files/list:
    post:
      tags: [Files]
      summary: List files available through a share
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { description: Share does not permit this operation. }

  /api/v1/shares/{shareCode}/files/{fileId}/download:
    post:
      tags: [Files]
      summary: Download a file available through a share
      parameters:
        - $ref: '#/components/parameters/ShareCode'
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Decrypted file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { description: Share does not permit this operation. }

components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token, not an ID token.
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareCode:
      name: shareCode
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data: {}
    FolderInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    VaultCreate:
      type: object
      additionalProperties: false
      required: [name, content, overallTtlSeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 500 }
        content: { type: string, minLength: 1, maxLength: 900000 }
        overallTtlSeconds: { type: integer, minimum: 1 }
        expiryPolicy: { type: string, enum: [DESTROY, REVOKE_ACCESS], default: DESTROY }
        folderId: { type: [string, 'null'], format: uuid }
    ShareCreate:
      type: object
      additionalProperties: false
      required: [readerId, permissions, maxAccessCount, postOpenTtlSeconds, passphrase]
      properties:
        readerId: { type: string, format: uuid }
        permissions:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [READ, WRITE] }
        maxAccessCount: { type: integer, minimum: 1, maximum: 1000 }
        postOpenTtlSeconds: { type: [integer, 'null'], minimum: 1 }
        passphrase: { type: string, minLength: 12, maxLength: 128 }
  responses:
    Success:
      description: Successful operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    BadRequest:
      description: Request validation failed.
    Unauthorized:
      description: Missing or invalid Cognito access token.
    NotFound:
      description: Resource not found or not owned by caller.
